name: Deploy to Production (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_TARGET: ${{ secrets.FTP_TARGET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, intl, bcmath, curl, openssl, fileinfo
          tools: composer:v2

      - name: Backend — composer install
        working-directory: zip-repl-1zip/Backend
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: zip-repl-1zip/Frontend/yarn.lock

      - name: Frontend — yarn install + build
        working-directory: zip-repl-1zip/Frontend
        env:
          CI: "false"
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Assemble merged public_html (staging)
        run: bash deploy/build-staging.sh

      - name: Install lftp
        run: |
          which lftp || sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy web via FTP
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "$FTP_HOST" \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                mirror -R --parallel=4 \
                --exclude-glob '.well-known' --exclude-glob '.well-known/**' \
                --exclude-glob '.git' --exclude-glob '.env' --exclude-glob '.env/**' \
                --exclude-glob 'uploads' --exclude-glob 'uploads/**' \
                deploy/_staging/ $FTP_TARGET ; quit"
        shell: bash

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: zip-repl-1zip/Frontend/yarn.lock

      - name: Frontend — yarn install + build
        working-directory: zip-repl-1zip/Frontend
        env:
          CI: "false"
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Sync Capacitor
        working-directory: zip-repl-1zip/Frontend
        run: npx cap sync android

      - name: Build APK (Debug — no keystore needed)
        working-directory: zip-repl-1zip/Frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install lftp
        run: |
          which lftp || sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload APK to server via FTP
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "$FTP_HOST" \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                mkdir -p $FTP_TARGET/uploads/app; \
                put zip-repl-1zip/Frontend/android/app/build/outputs/apk/debug/app-debug.apk -o $FTP_TARGET/uploads/app/BII.apk; \
                quit"
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_TARGET: ${{ secrets.FTP_TARGET }}
