    <title>বাংলা ইসলামিক ইনস্টিটিউট — ইলম, ঈমান ও আদব</title>
    <style>
        :root{
            --bii-cream:#F9F6F0;--bii-surface:#FFF;--bii-card:#FDFCF9;
            --bii-emerald:#0A422B;--bii-emerald-2:#0D5739;
            --bii-gold:#D4AF37;--bii-gold-2:#E6BE40;
            --bii-text:#11261E;--bii-text-soft:#4A5F55;--bii-border:#E5E0D5;
        }
        #splash{
            min-height:100vh;display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            background:var(--bii-emerald);
            font-family:'Hind Siliguri',system-ui,sans-serif;
            text-align:center;padding:2rem;
            animation:splashIn .35s ease-out both;
        }
        @keyframes splashIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
        #splash-logo{width:80px;height:80px;margin-bottom:1.25rem}
        #splash-title{
            font-family:'Tiro Bangla',Georgia,serif;
            font-size:1.35rem;color:#fff;line-height:1.5;
            max-width:320px;margin:0 0 .5rem;
        }
        #splash-sub{
            font-size:.8rem;color:rgba(255,255,255,.65);
            letter-spacing:.04em;margin:0 0 1.75rem;
        }
        #splash-spinner{
            width:32px;height:32px;
            border:3px solid rgba(212,175,55,.3);
            border-top-color:var(--bii-gold);
            border-radius:50%;animation:spin .7s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div id="splash">
        <svg id="splash-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="s-emerald" x1="0" y1="0" x2="64" y2="64">
                    <stop offset="0%" stop-color="#0D5739"/>
                    <stop offset="100%" stop-color="#0A422B"/>
                </linearGradient>
            </defs>
            <g transform="translate(32,32)">
                <rect x="-22" y="-22" width="44" height="44" rx="6" fill="url(#s-emerald)"/>
                <rect x="-22" y="-22" width="44" height="44" rx="6" fill="url(#s-emerald)" transform="rotate(45)"/>
                <rect x="-22" y="-22" width="44" height="44" rx="6" fill="none" stroke="#D4AF37" stroke-width="1.3" transform="rotate(45)" opacity=".9"/>
                <g transform="translate(0,2)">
                    <path d="M-14-2Q-7-7 0-3Q7-7 14-2L14 8Q7 4 0 8Q-7 4-14 8Z" fill="#FDFCF9"/>
                    <path d="M0-3L0 8" stroke="#D4AF37" stroke-width="1.2"/>
                </g>
                <path d="M-4-12a5 5 0 1 0 5 5a4 4 0 1 1-5-5" fill="#D4AF37" opacity=".95"/>
            </g>
        </svg>
        <div id="splash-title">বাংলা ইসলামিক ইনস্টিটিউট</div>
        <div id="splash-sub">ইলম · ঈমান · আদব</div>
        <div id="splash-spinner"></div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        (function(){
            var root = document.getElementById('root');
            var splash = document.getElementById('splash');
            function hide(){ if(splash) splash.style.display='none'; }
            if(root){
                var obs = new MutationObserver(function(mutations){
                    for(var i=0;i<mutations.length;i++){
                        var node = mutations[i].addedNodes;
                        for(var j=0;j<node.length;j++){
                            if(node[j].nodeType === 1 && node[j].childNodes.length > 0){
                                hide(); obs.disconnect(); return;
                            }
                        }
                    }
                });
                obs.observe(root, { childList: true, subtree: true });
            }
            setTimeout(hide, 3000);
        })();
    </script>

</body>
