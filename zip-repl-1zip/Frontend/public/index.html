        <style>
          /* Hide Replit "Made with Replit" badge */
          [data-replit-badge],#replit-badge,.replit-badge,
          iframe[src*="replit.com/badge"],
          a[href*="replit.com"][target="_blank"]:has(img[src*="replit"]),
          div[class*="replitBadge"],div[id*="replitBadge"],
          div[style*="z-index: 9999"][style*="position: fixed"]:has(a[href*="replit"]) {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
          }
        </style>
        <script>
          /* Continuously remove Replit badge if injected dynamically */
          (function(){
            function removeBadge(){
              document.querySelectorAll(
                '[data-replit-badge],[id*="replit-badge"],[class*="replit-badge"],iframe[src*="replit.com/badge"]'
              ).forEach(function(el){ el.remove(); });
            }
            var obs = new MutationObserver(removeBadge);
            document.addEventListener('DOMContentLoaded', function(){
              removeBadge();
              obs.observe(document.body, { childList: true, subtree: true });
            });
          })();
        </script>
